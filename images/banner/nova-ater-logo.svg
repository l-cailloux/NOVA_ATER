<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(10, 15)">
    <!-- Futuristic Cube Icon -->
    <path d="M45 15 L78 34 L78 72 L45 91 L12 72 L12 34 Z" fill="#131726" stroke="url(#textGrad)" stroke-width="3" filter="url(#glow)"/>
    <path d="M45 15 L45 53 L78 34" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M45 53 L12 34" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <path d="M45 53 L45 91" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="45" cy="53" r="4" fill="#a78bfa" filter="url(#glow)"/>
    
    <!-- Title Text -->
    <text x="98" y="58" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="42" fill="url(#textGrad)" letter-spacing="4" filter="url(#glow)">NOVA ATER</text>
    <text x="100" y="82" font-family="'Segoe UI', -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="3">FABRIC 1.21.1 • SERVEUR MODDÉ</text>
  </g>
</svg>